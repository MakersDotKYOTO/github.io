<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<title>ロボット競技大会 採点システム v2.1</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f6f8;--card:#fff;--text:#161616;--muted:#666;--line:#d9dce1;--black:#111;--ok:#0a6f39;--warn:#8d5500;--bad:#a11}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
header{background:#111;color:#fff;padding:15px 17px} header small{color:#ccc}
nav{display:flex;gap:8px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:9px;position:sticky;top:0;z-index:8}
button,a.btn,input,select{font:inherit;font-size:16px}
button,a.btn{min-height:44px;padding:9px 13px;border:1px solid #bbb;border-radius:10px;background:#fff;color:#111;text-decoration:none}
button.active,.primary{background:#111!important;color:#fff!important;border-color:#111!important}
main{max-width:1180px;margin:auto;padding:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.kpi{font-size:30px;font-weight:800}.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}.tablewrap{overflow-x:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:#555;background:#fafafa}.num{width:84px;min-height:42px;padding:7px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111}
.sel{min-width:116px;min-height:42px;padding:7px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111}
.teamtxt{width:100%;min-width:130px;min-height:42px;padding:7px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#eee}.ok{background:#e7f6ed;color:#086431}.wait{background:#fff0dc;color:#875000}.alert{background:#fff6df;border:1px solid #e7c77f;border-radius:10px;padding:10px 12px;color:#624300;margin:10px 0}.note{background:#f2f4f7;border-left:4px solid #444;padding:9px 11px;margin:10px 0}.scorebig{font-weight:800;font-size:17px}.danger{color:#a11}
.inlinecheck{display:flex;gap:6px;align-items:center;white-space:nowrap}.inlinecheck input{width:22px;height:22px}
@media(max-width:700px){main{padding:8px}.card{padding:10px}header{padding:12px}.num{width:72px}}

.stopwatch{border:2px solid #111;border-radius:16px;padding:14px;margin:12px 0;background:#fff}
.stopwatch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stopwatch-display{font-variant-numeric:tabular-nums;font-size:clamp(40px,8vw,74px);line-height:1;font-weight:900;letter-spacing:.02em;margin:14px 0 10px}
.stopwatch-controls{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:9px}
.stopwatch-controls button{min-height:58px;font-weight:800;font-size:18px}
.stopwatch-controls .start{background:#111;color:#fff;border-color:#111}
.stopwatch-controls .goal{background:#0b713b;color:#fff;border-color:#0b713b}
.stopwatch-controls .reset{background:#fff;color:#111}
.stopwatch-status{min-height:22px;margin-top:8px;font-size:13px;color:#555}
@media(max-width:600px){.stopwatch-controls{grid-template-columns:1fr 1fr}.stopwatch-controls .reset{grid-column:1/-1}.stopwatch-display{font-size:52px}}


.team-row{transition:background .15s ease,opacity .15s ease,outline .15s ease}
.team-row.selectable{cursor:pointer}
.team-row.selected{background:#eaf6ee;outline:3px solid #0b713b;outline-offset:-3px}
.team-row.locked{background:#f2f3f5;color:#888;opacity:.62}
.team-row.locked input,.team-row.locked select{pointer-events:none}
.team-select-btn{min-width:84px;font-weight:800}
.team-select-btn.selected{background:#0b713b!important;color:#fff!important;border-color:#0b713b!important}
.selection-panel{border:2px solid #0b713b;background:#f1faf4;border-radius:14px;padding:12px;margin:10px 0}
.selection-panel.empty{border-color:#bbb;background:#fafafa}
.selection-name{font-size:20px;font-weight:900}
.lock-message{font-size:13px;color:#666;margin-top:3px}
.unlock-btn{background:#fff;border-color:#777}


.team-select-btn.force{background:#fff7e6!important;color:#7a4a00!important;border-color:#d7a64a!important}
.team-select-btn.force:hover{background:#fff0cc!important}


.force-confirm{border:3px solid #d18b00;background:#fff6df;border-radius:14px;padding:14px;margin:12px 0}
.force-confirm-title{font-size:19px;font-weight:900;color:#6c4300;margin-bottom:7px}
.force-confirm-target{font-size:21px;font-weight:900;margin:7px 0}
.force-confirm-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.force-confirm-actions button{min-width:150px;font-weight:800}
.force-confirm-actions .confirm-force{background:#8b5700;color:#fff;border-color:#8b5700}


.lucky-options{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:7px;margin-top:7px}
.lucky-option{position:relative;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:9px;min-height:58px;padding:9px 34px 9px 10px;border:2px solid #c7c7c7;border-radius:11px;background:#fff;color:#111;cursor:pointer;user-select:none}
.lucky-option input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.lucky-option .symbol{font-size:25px;min-width:62px;text-align:center;font-weight:900;letter-spacing:.02em}
.lucky-option .desc{font-size:13px;line-height:1.25}
.lucky-option .pts{font-weight:900;white-space:nowrap;font-size:16px}
.lucky-option .pickmark{position:absolute;right:9px;top:8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:transparent;border:2px solid #bbb;background:#fff}
.lucky-option.chosen{border:3px solid #0b713b;background:#eef9f2;padding:8px 33px 8px 9px}
.lucky-option.chosen .pickmark{color:#fff;background:#0b713b;border-color:#0b713b}
.lucky-option.chosen .pts{color:#075d30}
@media(hover:hover) and (pointer:fine){.lucky-option:hover{border-color:#777;background:#fafafa}.lucky-option.chosen:hover{border-color:#0b713b;background:#eef9f2}}
@media(max-width:700px){.lucky-options{grid-template-columns:1fr}.lucky-option{grid-template-columns:76px 1fr auto}}


.fuku-sync{border:2px solid #2273b8;background:#eef7ff;border-radius:12px;padding:11px 12px;margin:10px 0}
.fuku-sync.ok{border-color:#0b713b;background:#eef9f2}
.fuku-sync.warn{border-color:#d18b00;background:#fff6df}
.fuku-sync-title{font-weight:900;margin-bottom:4px}
.source-auto{background:#eaf4ff;color:#155d94}
.source-manual{background:#eee;color:#444}


.inline-fuku-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.inline-fuku-frame{width:100%;height:1650px;border:1px solid #bbb;border-radius:12px;background:#fff}
.inline-fuku-note{font-size:13px;color:#666;margin-bottom:8px}
@media(max-width:700px){.inline-fuku-frame{height:1800px}}

</style>
</head>

<script>
(()=>{
const KEY='robot_competition_v22'; const OLD_KEY='robot_competition_v21';
const teamsSeed=()=>[
{id:'t1',no:'A',name:'ALFA（アルファ）',active:true},
{id:'t2',no:'B',name:'BRAVO（ブラボー）',active:true},
{id:'t3',no:'C',name:'CHARLIE（チャーリー）',active:true},
{id:'t4',no:'D',name:'DELTA（デルタ）',active:true},
{id:'t5',no:'E',name:'ECHO（エコー）',active:true},
{id:'t6',no:'F',name:'FOXTROT（フォックストロット）',active:true},
{id:'t7',no:'G',name:'GOLF（ゴルフ）',active:true},
{id:'t8',no:'H',name:'HOTEL（ホテル）',active:true}
];
let st;
try{st=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLD_KEY))||{teams:teamsSeed(),c1:{},c2:{},c3:{},c4:{}}}catch(e){st={teams:teamsSeed(),c1:{},c2:{},c3:{},c4:{}}}
for(const k of ['c1','c2','c3','c4']) st[k]??={};
st.teams??=teamsSeed();
const tempTeams=teamsSeed();
if(Array.isArray(st.teams)&&st.teams.length===8){const placeholder=st.teams.every((t,i)=>String(t.no||'').startsWith('仮')||/^Team\s+\d+$/.test(String(t.name||'')));if(placeholder)st.teams=tempTeams;}

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const active=()=>st.teams.filter(t=>t.active);
function save(){localStorage.setItem(KEY,JSON.stringify(st));render()}
function n(v){const x=Number(v);return Number.isFinite(x)?x:null}
function clamp(v,a,b){const x=n(v);return x===null?null:Math.max(a,Math.min(b,x))}
function compRanks(rows){rows=[...rows].sort((a,b)=>b.score-a.score);let prev=null,rank=0;return rows.map((x,i)=>{if(prev===null||x.score!==prev)rank=i+1;prev=x.score;return{...x,rank}})}
function rankMap(rows){return new Map(compRanks(rows).map(x=>[x.id,x.rank]))}
function timeRankMap(){
 const rows=active().map(t=>{const d=st.c1[t.id]||{};return {id:t.id,done:!!d.finished,time:n(d.time)}})
   .filter(x=>x.done&&x.time!==null&&x.time>=0).sort((a,b)=>a.time-b.time);
 let prev=null,rank=0;const m=new Map();
 rows.forEach((x,i)=>{if(prev===null||x.time!==prev)rank=i+1;prev=x.time;m.set(x.id,rank)});
 return m;
}
function quantityRankMap(){
 const rows=active().map(t=>({id:t.id,q:Math.max(0,Math.floor(n(st.c4[t.id]?.qty)??0))})).filter(x=>x.q>0).sort((a,b)=>b.q-a.q);
 let prev=null,rank=0;const m=new Map();
 rows.forEach((x,i)=>{if(prev===null||x.q!==prev)rank=i+1;prev=x.q;m.set(x.id,rank)});
 return m;
}
function c1Score(t){
 const d=st.c1[t.id]||{}, tr=timeRankMap(), r=tr.get(t.id);
 const finish=!!d.finished?5:0;
 const rankPts=(!!d.finished&&r&&r<=5)?6-r:0;
 const penalty=(d.assist?2:0)+(d.torii?2:0);
 const timePart=Math.max(0,Math.min(10,finish+rankPts-penalty));
 const offering=clamp(d.offering??0,0,3)??0;
 const claps=clamp(d.claps??0,0,2)??0;
 const bows=clamp(d.bows??0,0,3)??0;
 const manners=Math.max(0,Math.min(10,offering+claps*2+bows));
 const missing=!!d.finished&&(n(d.time)===null||n(d.time)<0);
 return {total:timePart+manners,timePart,manners,timeRank:r??null,rankPts,finish,penalty,missing,ready:!!d.entered};
}
function stallRaw(slot){
 if(!slot||!slot.type)return null;
 if(slot.type==='A'){
   return (slot.a1?10:0)+(slot.a2?10:0)+(slot.a3?10:0);
 }
 if(slot.type==='B'){
   const x=clamp(slot.bScore??0,0,30);return x===null?0:x;
 }
 if(slot.type==='C'){
   const v=String(slot.cState??'0');return v==='30'?30:v==='20'?20:0;
 }
 return null;
}
function c2Score(t){
 const d=st.c2[t.id]||{}, count=Number(d.count||1)===2?2:1;
 const s1=stallRaw(d.s1),s2=count===2?stallRaw(d.s2):null;
 if(s1===null)return {total:0,ready:false,raw:0,count,duplicate:false};
 if(count===1)return {total:s1,ready:true,raw:s1,count,duplicate:false};
 const duplicate=!!(d.s1?.type&&d.s2?.type&&d.s1.type===d.s2.type);
 if(s2===null)return {total:Math.min(30,s1*.6),ready:false,raw:s1,count,duplicate};
 const raw=s1+s2;return {total:Math.min(30,raw*0.6),ready:!duplicate,raw,count,duplicate};
}
function c3Score(t){
 const v=clamp(st.c3[t.id]?.score,0,30);
 return {total:v??0,ready:v!==null};
}
function c4Score(t){
 const q=Math.max(0,Math.floor(n(st.c4[t.id]?.qty)??0)), rm=quantityRankMap(), rank=rm.get(t.id)||null;
 const success=q>0?10:0;
 const rankPts=rank?Math.max(0,11-rank):0;
 return {total:Math.min(20,success+rankPts),qty:q,success,rank,rankPts,ready:st.c4[t.id]?.qty!==undefined&&st.c4[t.id]?.qty!==''};
}
function overall(t){const a=c1Score(t).total,b=c2Score(t).total,c=c3Score(t).total,d=c4Score(t).total;return {total:a+b+c+d,parts:[a,b,c,d]}}
function stageRank(fn){return rankMap(active().map(t=>({id:t.id,score:fn(t).total,ready:fn(t).ready})).filter(x=>x.ready))}
function qcsv(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
const FUKU_KEY='fukuwarai_competition_results_v1';
let fukuSyncInfo={imported:0,skipped:0,warnings:[],updatedAt:null};
function syncFukuwaraiResults(){
 let payload=null;
 try{payload=JSON.parse(localStorage.getItem(FUKU_KEY)||'null')}catch(e){payload=null}
 if(!payload||!Array.isArray(payload.results))return false;
 const counts={};
 payload.results.forEach(r=>{const no=Number(r.teamNumber);if(Number.isInteger(no))counts[no]=(counts[no]||0)+1});
 let changed=false, imported=0, skipped=0, warnings=[];
 for(const r of payload.results){
   const no=Number(r.teamNumber);
   if(!Number.isInteger(no)||no<1||no>8){skipped++;warnings.push(`Team番号 ${r.teamNumber??'?'} は対象外`);continue}
   if(counts[no]>1){skipped++;warnings.push(`Team ${no} が重複`);continue}
   const target=st.teams[no-1];
   if(!target){skipped++;warnings.push(`Team ${no} の割当先なし`);continue}
   const score=clamp(r.score,0,30);
   if(score===null){skipped++;warnings.push(`Team ${no} の得点が不正`);continue}
   st.c3[target.id]??={};
   const prev=st.c3[target.id];
   if(prev.score!==score||prev.source!=='fukuwarai_auto'||prev.fukuStatus!==r.status||prev.fukuUpdatedAt!==payload.updatedAt){
     st.c3[target.id]={
       ...prev,
       score,
       source:'fukuwarai_auto',
       fukuTeamNumber:no,
       fukuStatus:r.status||'OK',
       fukuManual:!!r.manual,
       fukuFile:r.file||'',
       fukuUpdatedAt:payload.updatedAt||null
     };
     changed=true;
   }
   imported++;
 }
 fukuSyncInfo={imported,skipped,warnings:[...new Set(warnings)],updatedAt:payload.updatedAt||null};
 if(changed)localStorage.setItem(KEY,JSON.stringify(st));
 return changed;
}
function formatSyncTime(iso){
 if(!iso)return '—';
 try{return new Date(iso).toLocaleString('ja-JP')}catch(e){return iso}
}

let selectedC1TeamId='';
let pendingForceTeamId='';
let stopwatch={running:false,teamId:'',startedAt:0,elapsedMs:0,timer:null};
function formatStopwatch(ms){
 const total=Math.max(0,ms)/1000;
 const min=Math.floor(total/60);
 const sec=Math.floor(total%60);
 const cs=Math.floor((total-Math.floor(total))*100);
 return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function currentElapsedMs(){return stopwatch.running ? stopwatch.elapsedMs+(Date.now()-stopwatch.startedAt) : stopwatch.elapsedMs}
function updateStopwatchDisplay(){
 const el=document.getElementById('stopwatchDisplay');
 if(el) el.textContent=formatStopwatch(currentElapsedMs());
}
function startStopwatch(){
 if(!selectedC1TeamId){alert('先に計測するTeamを選択してください。');return}
 if(stopwatch.running)return;
 stopwatch.teamId=selectedC1TeamId;
 stopwatch.elapsedMs=0;
 stopwatch.startedAt=Date.now();
 stopwatch.running=true;
 if(stopwatch.timer)clearInterval(stopwatch.timer);
 stopwatch.timer=setInterval(updateStopwatchDisplay,31);
 updateStopwatchDisplay();
 const status=document.getElementById('stopwatchStatus');
 const team=st.teams.find(t=>t.id===stopwatch.teamId);
 if(status)status.textContent=`計測中：${team?.no??''} ${team?.name??''}`;
 renderStopwatchButtons();
}
function goalStopwatch(){
 if(!stopwatch.running)return;
 const elapsed=currentElapsedMs();
 stopwatch.running=false;
 stopwatch.elapsedMs=elapsed;
 clearInterval(stopwatch.timer);stopwatch.timer=null;
 const seconds=Math.round(elapsed/10)/100; // 0.01 sec
 const id=stopwatch.teamId;
 st.c1[id]??={};
 st.c1[id].time=seconds.toFixed(2);
 st.c1[id].finished=true;
 st.c1[id].entered=true;
 localStorage.setItem(KEY,JSON.stringify(st));
 render();
 const status=document.getElementById('stopwatchStatus');
 const team=st.teams.find(t=>t.id===id);
 if(status)status.textContent=`保存しました：${team?.no??''} ${team?.name??''}　${seconds.toFixed(2)}秒`;
 // preserve stopped display after render
 const d=document.getElementById('stopwatchDisplay');if(d)d.textContent=formatStopwatch(elapsed);
 renderStopwatchButtons();
}
function resetStopwatch(){
 if(stopwatch.timer)clearInterval(stopwatch.timer);
 stopwatch.running=false;stopwatch.startedAt=0;stopwatch.elapsedMs=0;stopwatch.timer=null;
 updateStopwatchDisplay();
 const status=document.getElementById('stopwatchStatus');if(status)status.textContent='計測待機中';
 renderStopwatchButtons();
}
function renderStopwatchButtons(){

}

function decodeEmbeddedHtml(){
 const raw=document.getElementById('fukuEmbeddedSource')?.textContent.trim()||'';
 if(!raw)return '';
 const bin=atob(raw);
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder('utf-8').decode(bytes);
}

   <div><h2 style="margin:0">福笑い競技 <span class="muted">/30点</span></h2><div class="muted">貼付21 + 位置7.2 + 角度1.8</div></div>
   <button type="button" class="primary" id="openFukuIntegrated">福笑い自動採点を開く</button>
 </div>
 <div class="note">「福笑い自動採点を開く」で同じ画面内に採点システムを表示します。一括採点・手動補正の最終点は、そのまま統合画面へ自動反映されます。</div>
 <div class="fuku-sync ${syncClass}">
   <div class="fuku-sync-title">福笑い自動連携</div>
   <div>${syncMsg}</div>
   ${fukuSyncInfo.warnings.length?`<div class="danger" style="margin-top:5px">要確認：${fukuSyncInfo.warnings.map(esc).join(' / ')}</div>`:''}
   <div class="actions" style="margin-top:8px"><button type="button" id="syncFukuNow">最新結果を再取り込み</button></div>
 </div>
 <div class="note">現在の仮Teamでは、福笑いの検出番号 1→A/ALFA、2→B/BRAVO … 8→H/HOTEL の順に対応します。正式エントリー情報受領後にマッピングを更新します。</div>
 <div class="note">観客投票ボーナスは未実施で確定。採点はAI判定の30点満点のみです。</div>
 <div class="tablewrap"><table><tr><th>順位</th><th>No.</th><th>Team</th><th>AI採点結果 /30</th><th>連携状態</th><th>判定</th></tr>
 ${active().map(t=>{const s=c3Score(t),v=st.c3[t.id]?.score??'',d=st.c3[t.id]||{},auto=d.source==='fukuwarai_auto';return `<tr>
   <td>${sr.get(t.id)??'—'}</td><td>${esc(t.no)}</td><td>${esc(t.name)}</td>
   <td><input inputmode="decimal" class="num" data-c3="${t.id}" value="${esc(v)}" placeholder="0-30"></td>
   <td>${auto?`<span class="badge source-auto">自動反映${d.fukuManual?'・手動補正済':''}</span>`:`<span class="badge source-manual">${s.ready?'手入力':'未入力'}</span>`}</td>
   <td>${auto&&d.fukuStatus==='CHECK'?'<span class="badge wait">要確認</span>':s.ready?'<span class="badge ok">入力済</span>':'<span class="badge wait">未入力</span>'}</td>
 </tr>`}).join('')}
 </table></div></div>`;
 document.querySelectorAll('[data-c3]').forEach(x=>x.onchange=()=>{
   const id=x.dataset.c3;st.c3[id]??={};const v=clamp(x.value,0,30);
   st.c3[id].score=v===null?'':v;
   st.c3[id].source='manual';
   st.c3[id].fukuStatus=null;
   save();
 });
 const syncBtn=document.getElementById('syncFukuNow');
 if(syncBtn)syncBtn.onclick=()=>{syncFukuwaraiResults();render()};
 const openBtn=document.getElementById('openFukuIntegrated');
 if(openBtn)openBtn.onclick=openFukuwaraiIntegrated;
}
function renderC4(){
 const sr=stageRank(c4Score),qr=quantityRankMap();
 document.getElementById('c4').innerHTML=`<div class="card"><h2>いちごの掴み取り競技 <span class="muted">/20点</span></h2>
 <div class="note">1個以上成功で10点。獲得数の順位点は1位10点〜10位1点。現在8チームなので、全チームが1個以上なら8位は3点です。0個は成功点・順位点とも0点。</div>
 <div class="note">獲得数が同数の場合も同順位で確定。順位点も同順位に対応する同じ点数を付与します。</div>
 <div class="tablewrap"><table><tr><th>競技順位</th><th>No.</th><th>Team</th><th>獲得数</th><th>量順位</th><th>成功点</th><th>順位点</th><th>合計</th></tr>
 ${active().map(t=>{const s=c4Score(t),v=st.c4[t.id]?.qty??'';return `<tr><td>${sr.get(t.id)??'—'}</td><td>${esc(t.no)}</td><td>${esc(t.name)}</td><td><input inputmode="numeric" class="num" data-c4="${t.id}" value="${esc(v)}" placeholder="個"></td><td>${qr.get(t.id)??'—'}</td><td>${s.success}</td><td>${s.rankPts}</td><td class="scorebig">${s.total}</td></tr>`}).join('')}
 </table></div></div>`;
 document.querySelectorAll('[data-c4]').forEach(x=>x.onchange=()=>{const id=x.dataset.c4;st.c4[id]??={};const v=n(x.value);st.c4[id].qty=v===null?'':Math.max(0,Math.floor(v));save()});
}
function renderOverall(){
 const rows=active().map(t=>({id:t.id,t,score:overall(t).total,o:overall(t)})), rr=compRanks(rows), stageMaps=[stageRank(c1Score),stageRank(c2Score),stageRank(c3Score),stageRank(c4Score)];
 document.getElementById('overall').innerHTML=`<div class="card"><h2>総合順位 <span class="muted">/100点</span></h2>
 <div class="note">総合得点 = 初詣20 + 屋台30 + 福笑い30 + いちご20。同点は正式に同順位として扱います。</div>
 <div class="tablewrap"><table><tr><th>総合順位</th><th>No.</th><th>Team</th><th>初詣</th><th>屋台</th><th>福笑い</th><th>いちご</th><th>合計</th></tr>
 ${rr.map(r=>`<tr><td><b>${r.rank}</b></td><td>${esc(r.t.no)}</td><td>${esc(r.t.name)}</td><td>${c1Score(r.t).total.toFixed(1)} <span class="muted">(${stageMaps[0].get(r.t.id)}位)</span></td><td>${c2Score(r.t).total.toFixed(1)} <span class="muted">(${stageMaps[1].get(r.t.id)}位)</span></td><td>${c3Score(r.t).total.toFixed(1)} <span class="muted">(${stageMaps[2].get(r.t.id)}位)</span></td><td>${c4Score(r.t).total.toFixed(1)} <span class="muted">(${stageMaps[3].get(r.t.id)}位)</span></td><td class="scorebig">${r.score.toFixed(1)}</td></tr>`).join('')}
 </table></div></div>
 <div class="card"><div class="actions"><button id="csv">総合CSV保存</button><button id="backup">バックアップJSON保存</button><label class="btn">バックアップJSON読込<input id="restore" type="file" accept=".json,application/json" style="display:none"></label><button id="reset">採点データ初期化</button></div></div>`;
 document.getElementById('csv').onclick=()=>{const head=['rank','entry_no','team_name','初詣','初詣順位','屋台','屋台順位','福笑い','福笑い順位','いちご','いちご順位','total'];const lines=[head.join(',')];rr.forEach(r=>lines.push([r.rank,qcsv(r.t.no),qcsv(r.t.name),c1Score(r.t).total,stageMaps[0].get(r.t.id),c2Score(r.t).total,stageMaps[1].get(r.t.id),c3Score(r.t).total,stageMaps[2].get(r.t.id),c4Score(r.t).total,stageMaps[3].get(r.t.id),r.score].join(',')));dl('overall_results.csv','\ufeff'+lines.join('\n'),'text/csv')};
 document.getElementById('backup').onclick=()=>dl('competition_backup_v21.json',JSON.stringify(st,null,2),'application/json');
 document.getElementById('restore').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.teams)throw new Error('invalid');st=obj;for(const k of ['c1','c2','c3','c4'])st[k]??={};save();alert('バックアップを読み込みました。')}catch(err){alert('JSONを読み込めませんでした。')}};
 document.getElementById('reset').onclick=()=>{if(confirm('全競技の採点データを初期化しますか？ Team設定は残します。')){st.c1={};st.c2={};st.c3={};st.c4={};save()}};
}
function dl(name,text,type){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){syncFukuwaraiResults();renderHome();renderTeams();renderC1();renderC2();renderC3();renderC4();renderOverall()}
document.getElementById('closeInlineFuku')?.addEventListener('click',closeFukuwaraiIntegrated);
window.addEventListener('message',e=>{
  if(e.data?.type==='fukuwarai-results-updated'){
    syncFukuwaraiResults();
    render();
  }
  if(e.data?.type==='close-fukuwarai'){
    closeFukuwaraiIntegrated();
  }
});
window.addEventListener('pageshow',()=>{if(syncFukuwaraiResults())render()});
window.addEventListener('focus',()=>{if(syncFukuwaraiResults())render()});
window.addEventListener('storage',e=>{if(e.key===FUKU_KEY){syncFukuwaraiResults();render()}});
render();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
